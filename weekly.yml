name: Weekly wine price scan

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC (06:00 or 07:00 in Girona)
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N wines (for testing; 0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run scan
        run: python -m agent.run --limit "${{ github.event.inputs.limit || 0 }}" | tee /tmp/report.md
      - name: Show report in the run summary
        if: always()
        run: cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit results
        run: |
          git config user.name "wine-price-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Weekly scan $(date -u +%F)"
          git push
